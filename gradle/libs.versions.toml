[versions]

kotlin = "2.4.10"
agp = "9.3.0"
ksp = "2.3.9"
compose-multiplatform = "1.11.1"
material3 = "1.11.0-alpha07"
androidx-activityCompose = "1.13.0"
constraint-layout = "1.1.1"
kermit = "2.1.0"
kotlinx-coroutines = "1.11.0"
androidx-nav3 = "1.1.1"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
multiplatformSettings = "1.3.0"
buildConfig = "6.0.10"
kotlinStdlib = "2.4.10"
kotlinTest = "2.4.0"
runner = "1.7.0"
core = "1.7.0"
junit = "1.3.0"
koin = "4.2.2"
ktx = "1.19.0"
coil = "3.5.0"
media = "1.10.1"
room = "2.8.4"
work-manager = "2.11.2"
startupRuntime = "1.2.0"
permissions = "0.12.0"

androidSdkMin = "26"
androidSdkTarget = "37"
androidSdkCompiled = "37"

[libraries]

#Compose
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-ktx-core = { module = "androidx.core:core-ktx", version.ref = "ktx" }
androidx-constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraint-layout" }

#Logger
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

#Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

#Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose-core = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

#navigation
compose-nav3 = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-nav3" }

#KotlinX
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

#Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlib" }

#Test
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-core = { module = "androidx.test:core", version.ref = "core" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlinTest" }

#Permissions
permissions-core = { module = "com.mohamedrejeb.calf:calf-permissions-core", version.ref = "permissions" }
permissions-gallery = { module = "com.mohamedrejeb.calf:calf-permissions-gallery", version.ref = "permissions" }

#Image loader
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-http = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

#Media
androidx-media-exoplayer-core = { module = "androidx.media3:media3-exoplayer", version.ref = "media" }
androidx-media-session = { module = "androidx.media3:media3-session", version.ref = "media" }
androidx-media-cast = { module = "androidx.media3:media3-cast", version.ref = "media" }
androidx-media-ktx = { module = "androidx.media3:media3-common-ktx", version.ref = "media" }
androidx-media-ui = { module = "androidx.media3:media3-ui", version.ref = "media" }

#Room database
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-sqlite-wrapper = { module = "androidx.room:room-sqlite-wrapper", version.ref = "room" }

multiplatformSettings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }

#Work manager
androidx-workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "work-manager" }

[plugins]

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildConfig" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
